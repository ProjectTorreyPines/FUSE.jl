name: container

# Build and publish the FUSE container to ghcr.io/projecttorreypines/fuse:
# linux/amd64 and linux/arm64 (native Apple Silicon) built in parallel and
# combined into one multi-arch tag.
#
# MANUAL DISPATCH ONLY — not viable on standard GitHub-hosted runners: the
# sysimage object emission peaks at ~98.5 GiB RSS (measured on omega,
# 2026-07-26), far beyond their 16 GB (swap and workload trimming both fail;
# runs 30170851378, 30177176119, 30185669953). Requires 32-core/128 GB larger
# runners to ever run in CI. Until then, release images are built on omega
# and pushed with deploy/omega-container/publish_ghcr.sh.

on:
  workflow_dispatch:
    inputs:
      fuse_version:
        description: "FUSE release to build (e.g. v1.1.5); empty = latest release"
        required: false
        default: ""
      workload:
        description: "Sysimage trace workload"
        type: choice
        options: [full, light]
        default: full

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/projecttorreypines/fuse

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v="${{ github.event.release.tag_name }}"
          [ -z "$v" ] && v="${{ inputs.fuse_version }}"
          [ -z "$v" ] && v="$(curl -s https://api.github.com/repos/ProjectTorreyPines/FUSE.jl/releases/latest | jq -r .tag_name)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building FUSE $v"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            # universal x86_64 set: NERSC Perlmutter (znver3), GA omega
            # (cascadelake/znver2/znver3), generic fallback for laptops
            cpu_target: "generic;cascadelake,-xsaveopt,-rdrnd,clone_all;znver2,-xsaveopt,-rdrnd,clone_all;znver3,-xsaveopt,-rdrnd,clone_all"
          - arch: arm64
            runner: ubuntu-24.04-arm
            # Apple Silicon (Docker/podman VMs on Macs) + generic aarch64
            cpu_target: "generic;apple-m1,clone_all"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    steps:
      # the unpacked image is ~19 GB and the runner disk is shared with
      # preinstalled toolchains we don't need
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # sysimage object emission peaks beyond the 16 GB runner RAM (the OOM
      # starves the runner agent -> "runner lost communication"); swap lets
      # the peak spill to disk at the cost of some speed
      - name: Add swap
        run: |
          for loc in /mnt /; do
            avail=$(df -BG --output=avail "$loc" | tail -1 | tr -dc '0-9')
            if   [ "$avail" -ge 30 ]; then size=28G
            elif [ "$avail" -ge 20 ]; then size=18G
            else continue; fi
            sudo fallocate -l "$size" "$loc/swapfile-ci" \
              && sudo chmod 600 "$loc/swapfile-ci" \
              && sudo mkswap "$loc/swapfile-ci" \
              && sudo swapon "$loc/swapfile-ci" \
              && break
          done
          free -h

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (heavy — compiles the FUSE sysimage)
        run: |
          docker build \
            -f deploy/perlmutter-container/Containerfile \
            --build-arg JULIA_CPU_TARGET="${{ matrix.cpu_target }}" \
            --build-arg FUSE_PRECOMPILE_WORKLOAD="${{ inputs.workload || 'full' }}" \
            --build-arg FUSE_VERSION="${{ needs.version.outputs.version }}" \
            -t "$IMAGE:${{ needs.version.outputs.version }}-${{ matrix.arch }}" \
            .

      - name: Verify the image contains the released FUSE version
        run: |
          got="$(docker run --rm "$IMAGE:${{ needs.version.outputs.version }}-${{ matrix.arch }}" \
                 fuse -e 'import FUSE; print(pkgversion(FUSE))')"
          echo "image has FUSE v$got, release is ${{ needs.version.outputs.version }}"
          [ "v$got" = "${{ needs.version.outputs.version }}" ]

      - name: Push per-arch tag
        run: docker push "$IMAGE:${{ needs.version.outputs.version }}-${{ matrix.arch }}"

  manifest:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest (version + latest)
        run: |
          v="${{ needs.version.outputs.version }}"
          docker buildx imagetools create \
            -t "$IMAGE:$v" -t "$IMAGE:latest" \
            "$IMAGE:$v-amd64" "$IMAGE:$v-arm64"
          docker buildx imagetools inspect "$IMAGE:$v"
